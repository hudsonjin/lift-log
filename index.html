<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="screen-log">
    <h1>Log a Workout</h1>

    <select id="exercise-select">
      <option>Flat Bench</option>
      <option>Lat Pulldown</option>
      <option>Incline DB Bench</option>
      <option>Single-arm DB Row</option>
      <option>Chest Fly</option>
      <option>BB Bicep Curls</option>
      <option>Skull Crushers</option>
      <option>Incline DB Curls</option>
      <option>Tricep Pushdowns</option>
      <option>DB Curls</option>
      <option>Pull-ups</option>
      <option>Tricep Dips</option>
    </select>

    <p id="log-message"></p>

    <div id="weight-field">
      <label id="weight-label" for="weight-input">Weight</label>
      <input type="number" id="weight-input" placeholder="Weight">
    </div>

    <div id="reps-fields">
      <label>Set 1 Reps: <input type="number" class="reps-input" id="reps-input-0"></label>
      <label>Set 2 Reps: <input type="number" class="reps-input" id="reps-input-1"></label>
      <label>Set 3 Reps: <input type="number" class="reps-input" id="reps-input-2"></label>
    </div>

    <button id="save-session-button">Save Session</button>
  </section>

  <section id="screen-history" hidden>
    <h1>Workout History</h1>
    <div id="history-list"></div>
  </section>

  <section id="screen-export" hidden>
    <h1>Export</h1>
    <p>Coming in step 5.</p>
  </section>

  <nav id="tab-bar">
    <button id="tab-log" class="tab-button">Log</button>
    <button id="tab-history" class="tab-button">History</button>
    <button id="tab-export" class="tab-button">Export</button>
  </nav>

  <script src="storage.js"></script>
  <script>
    function showScreen(name) {
      document.getElementById('screen-log').hidden = name !== 'log';
      document.getElementById('screen-history').hidden = name !== 'history';
      document.getElementById('screen-export').hidden = name !== 'export';

      if (name === 'history') {
        renderHistory();
      }
    }

    document.getElementById('tab-log').addEventListener('click', function () {
      showScreen('log');
    });

    document.getElementById('tab-history').addEventListener('click', function () {
      showScreen('history');
    });

    document.getElementById('tab-export').addEventListener('click', function () {
      showScreen('export');
    });

    showScreen('log');
  </script>

  <script>
    const BODYWEIGHT_EXERCISES = ['Pull-ups', 'Tricep Dips'];

    function isBodyweightExercise(exercise) {
      return BODYWEIGHT_EXERCISES.includes(exercise);
    }

    function hasHistory(exercise) {
      return loadEntries().some(function (entry) {
        return entry.exercise === exercise;
      });
    }

    function clearRepsInputs() {
      document.getElementById('reps-input-0').value = '';
      document.getElementById('reps-input-1').value = '';
      document.getElementById('reps-input-2').value = '';
    }

    function renderLogForm() {
      const exercise = document.getElementById('exercise-select').value;
      const messageBox = document.getElementById('log-message');
      const weightField = document.getElementById('weight-field');
      const weightInput = document.getElementById('weight-input');
      const weightLabel = document.getElementById('weight-label');
      const saveButton = document.getElementById('save-session-button');

      weightInput.value = '';
      clearRepsInputs();
      saveButton.disabled = false;

      if (isBodyweightExercise(exercise)) {
        messageBox.textContent = 'bodyweight — no suggestion made';
        weightField.hidden = true;
        return;
      }

      weightField.hidden = false;

      let exerciseHasHistory;
      try {
        exerciseHasHistory = hasHistory(exercise);
      } catch (error) {
        messageBox.textContent = 'Unable to load saved workouts. Storage may be blocked or corrupted.';
        saveButton.disabled = true;
        return;
      }

      if (exerciseHasHistory) {
        messageBox.textContent = '';
        weightLabel.textContent = 'Weight';
      } else {
        messageBox.textContent = 'First time logging this exercise. Enter your starting weight below.';
        weightLabel.textContent = 'Starting Weight';
      }
    }

    document.getElementById('exercise-select').addEventListener('change', renderLogForm);

    document.getElementById('save-session-button').addEventListener('click', function () {
      const exercise = document.getElementById('exercise-select').value;
      const bodyweight = isBodyweightExercise(exercise);
      const messageBox = document.getElementById('log-message');

      const repsValues = [
        document.getElementById('reps-input-0').value,
        document.getElementById('reps-input-1').value,
        document.getElementById('reps-input-2').value
      ];

      const hasInvalidReps = repsValues.some(function (value) {
        return value === '' || Number(value) <= 0;
      });

      if (hasInvalidReps) {
        alert('Please enter a valid number of reps (greater than 0) for all 3 sets.');
        return;
      }

      let weight;

      if (bodyweight) {
        weight = 'bodyweight';
      } else {
        const weightInputValue = document.getElementById('weight-input').value;

        if (weightInputValue === '' || Number(weightInputValue) <= 0) {
          alert('Please enter a valid weight (greater than 0).');
          return;
        }

        weight = Number(weightInputValue);
      }

      try {
        addEntry({
          exercise: exercise,
          weight: weight,
          reps: repsValues.map(Number)
        });
      } catch (error) {
        messageBox.textContent = 'Unable to save. Storage may be blocked or corrupted.';
        return;
      }

      renderLogForm();
    });

    renderLogForm();
  </script>

  <script>
    let pendingDeleteId = null;

    function formatReps(repsArray) {
      return repsArray.join(', ');
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function sortEntriesNewestFirst(entries) {
      return entries
        .map(function (entry, index) {
          return { entry: entry, index: index };
        })
        .sort(function (a, b) {
          if (b.entry.timestamp !== a.entry.timestamp) {
            return b.entry.timestamp - a.entry.timestamp;
          }
          return b.index - a.index;
        })
        .map(function (wrapped) {
          return wrapped.entry;
        });
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      let entries;
      try {
        entries = loadEntries();
      } catch (error) {
        container.textContent = 'Unable to load saved workouts. Storage may be blocked or corrupted.';
        return;
      }

      if (entries.length === 0) {
        container.textContent = 'No workouts logged yet.';
        return;
      }

      sortEntriesNewestFirst(entries).forEach(function (entry) {
        const row = document.createElement('div');
        row.className = 'history-row';

        const weightText = entry.weight === 'bodyweight' ? 'bodyweight' : entry.weight + ' lbs';

        const summary = document.createElement('span');
        summary.textContent =
          entry.exercise + ' — ' + weightText + ' — Reps: ' + formatReps(entry.reps) + ' — ' + formatDate(entry.timestamp);
        row.appendChild(summary);

        if (entry.id === pendingDeleteId) {
          const confirmText = document.createElement('span');
          confirmText.textContent = ' Delete this session? ';
          row.appendChild(confirmText);

          const yesButton = document.createElement('button');
          yesButton.textContent = 'Yes';
          yesButton.addEventListener('click', function () {
            try {
              deleteEntry(entry.id);
            } catch (error) {
              container.textContent = 'Unable to delete. Storage may be blocked or corrupted.';
              return;
            }
            pendingDeleteId = null;
            renderHistory();
          });
          row.appendChild(yesButton);

          const cancelButton = document.createElement('button');
          cancelButton.textContent = 'Cancel';
          cancelButton.addEventListener('click', function () {
            pendingDeleteId = null;
            renderHistory();
          });
          row.appendChild(cancelButton);
        } else {
          const deleteButton = document.createElement('button');
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', function () {
            pendingDeleteId = entry.id;
            renderHistory();
          });
          row.appendChild(deleteButton);
        }

        container.appendChild(row);
      });
    }
  </script>
</body>
</html>
